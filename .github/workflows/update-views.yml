name: Update Unique Views Counter

on:
  schedule:
    - cron: '0 */12 * * *' # Run every 12 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-views:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and Update Views
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c '
          import os, json, re, urllib.request

          repo = os.environ.get("GITHUB_REPOSITORY")
          token = os.environ.get("GITHUB_TOKEN")

          req = urllib.request.Request(f"https://api.github.com/repos/{repo}/traffic/views")
          req.add_header("Authorization", f"Bearer {token}")
          req.add_header("Accept", "application/vnd.github.v3+json")

          try:
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode())
          except Exception as e:
              print("Error fetching traffic:", e)
              exit(1)

          db_file = "views.json"
          if os.path.exists(db_file):
              with open(db_file, "r") as f:
                  try:
                      db = json.load(f)
                  except:
                      db = {"offset": 427}
          else:
              db = {"offset": 427}

          for view in data.get("views", []):
              date = view["timestamp"][:10]
              db[date] = view["uniques"]

          total_uniques = sum(v for k, v in db.items() if k != "offset") + db.get("offset", 0)

          with open(db_file, "w") as f:
              json.dump(db, f, indent=2)

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          pattern = r"https://(?:komarev\.com/ghpvc/\?username=[^&]+&label=Profile%20Views&color=[^&]+&style=for-the-badge|img\.shields\.io/badge/Profile%20Views-\d+-%23[0-9a-fA-F]+\.svg\?style=for-the-badge)"
          replacement = f"https://img.shields.io/badge/Profile%20Views-{total_uniques}-%23500299.svg?style=for-the-badge"
          
          new_readme = re.sub(pattern, replacement, readme)

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new_readme)
          print(f"Updated total unique views to {total_uniques}")
          '
          
      - name: Commit and push changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md views.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update unique profile views [skip ci]" && git push)
